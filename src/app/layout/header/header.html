<mat-toolbar
  class="app-header">
  <div class="header-left">
    <button
      mat-icon-button
      class="menu-button"
      [matMenuTriggerFor]="navigationMenu"
      aria-label="Menü öffnen"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #navigationMenu="matMenu">
      <button mat-menu-item routerLink="/shops">
        <mat-icon>store</mat-icon>
        <span>Shops</span>
      </button>

      @if (isAdminUser) {
        <button mat-menu-item routerLink="/users">
          <mat-icon>group</mat-icon>
          <span>Benutzer</span>
        </button>
      }

      @if (!isAuthenticated) {
        <button mat-menu-item (click)="login()">
          <mat-icon>login</mat-icon>
          <span>Login</span>
        </button>
      }
    </mat-menu>

    <div class="app-title">
      <img
        src="/images/finga-logo.png"
        alt="FingA Logo"
        class="app-logo"
      />
    </div>
  </div>



  <span class="spacer"></span>

  <div class="app-user">

    <!-- Shops -->
    <a
      mat-button
      routerLink="/shops">

      <mat-icon>store</mat-icon>
      Shops

    </a>


    <!-- Nur ADMIN -->
    @if (isAdminUser) {

      <a
        mat-button
        routerLink="/users">

        <mat-icon>group</mat-icon>
        Benutzer

      </a>

    }


    <!-- Gast -->
    @if (!isAuthenticated) {

      <button
        mat-button
        type="button"
        (click)="login()">

        <mat-icon>login</mat-icon>
        Login

      </button>

    }


    <!-- Eingeloggt -->
    @if (isAuthenticated) {

      <button
        mat-button
        type="button"
        [matMenuTriggerFor]="userMenu">

        <mat-icon>person</mat-icon>

        {{ currentUser?.username || 'Benutzer' }}

      </button>

    }

  </div>

</mat-toolbar>


<!-- Benutzer-Menü -->

<mat-menu #userMenu="matMenu">

  @if (currentUser) {

    <button
      mat-menu-item
      disabled>

      <mat-icon>person</mat-icon>

      <span>
        {{ currentUser.username }}
      </span>

    </button>

    <button
      mat-menu-item
      disabled>

      <mat-icon>email</mat-icon>

      <span>
        {{ currentUser.email }}
      </span>

    </button>

  }

  <button
    mat-menu-item
    (click)="logout()">

    <mat-icon>logout</mat-icon>

    <span>
      Logout
    </span>

  </button>

</mat-menu>
